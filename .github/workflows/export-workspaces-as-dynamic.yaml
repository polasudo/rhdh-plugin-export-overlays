name: Export Workspace as Dynamic Plugins Packages
on:
  workflow_dispatch:
    inputs:
      workspace-path:
        type: string
        required: true
      overlay-branch:
        type: string
        required: true
      publish-container:
        type: boolean
        default: false
jobs:
  export:
    uses: redhat-developer/rhdh-plugin-export-utils/.github/workflows/export-workspaces-as-dynamic.yaml@main
    with:
      workspace-path: ${{ inputs.workspace-path }}
      overlay-branch: ${{ inputs.overlay-branch }}
      overlay-repo: redhat-developer/rhdh-plugin-export-overlays
      publish-container: ${{ inputs.publish-container }}
      image-registry-user: ${{ github.actor }}
    secrets:
      image-registry-password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
      attestations: write
      packages: write
      id-token: write
